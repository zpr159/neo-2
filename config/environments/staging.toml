# Neo Configuration — Staging Profile
#
# Staging mirrors production with reduced resource limits.
# Used for pre-release validation and integration testing.

[core]
version = "0.1.0"
environment = "staging"
debug = false
worker_threads = 8

[runtime]
max_memory_mb = 8192
enable_wasm = true
sandbox_mode = "strict"
task_timeout_secs = 120

[neural]
device = "auto"
batch_size = 64
model_cache_size_mb = 2048

[inference]
backend = "auto"
max_concurrent_requests = 32
request_timeout_secs = 120

[memory]
working_memory_size = 4096
episodic_storage_path = "/var/lib/neo/episodic"
semantic_storage_path = "/var/lib/neo/semantic"
enable_embeddings = true

[knowledge_graph]
storage_path = "/var/lib/neo/knowledge_graph"
enable_persistence = true
cache_size_mb = 1024

[reasoning]
max_chain_depth = 50
enable_explanation = true
timeout_secs = 300

[executive]
max_concurrent_goals = 64
planning_horizon = 100
scheduler_interval_ms = 50

[agents]
max_agents = 256
heartbeat_interval_secs = 5
enable_self_improvement = false

[security]
enable_mtls = true
sandbox_level = "strict"
audit_logging = true
encryption_at_rest = true

[logging]
level = "info"
format = "json"
output = "file"
enable_file_logging = true
log_dir = "/var/log/neo"
max_file_size_mb = 500
max_files = 30
enable_json = true

[tracing]
enabled = true
endpoint = "http://jaeger:4317"
sample_rate = 0.1

[network]
bind_address = "0.0.0.0"
port = 8080
tls_enabled = true

[distributed]
enable_clustering = true
node_discovery = "dns"
gossip_interval_ms = 500
seed_nodes = []

[plugins]
enabled = true
plugin_dir = "/var/lib/neo/plugins"
auto_discover = true
