---
name: Bug Report
description: Report a bug in Neo
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which subsystem is affected?
      options:
        - Core
        - Runtime
        - Neural Engine
        - Neural Network Framework
        - Inference
        - Memory
        - Knowledge Graph
        - Reasoning
        - Executive
        - Capabilities
        - Agents
        - Workflows
        - Tools
        - Distributed
        - Robotics
        - Business
        - Security
        - UI
        - SDK
        - Plugins
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details.
      placeholder: |
        OS: Ubuntu 22.04
        Rust: 1.75.0
        GPU: NVIDIA A100 (if applicable)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output.
      render: shell
