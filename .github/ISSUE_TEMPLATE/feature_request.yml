---
name: Feature Request
description: Suggest a new feature for Neo
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you'd like to see in Neo.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which subsystem would this affect?
      options:
        - Core
        - Runtime
        - Neural Engine
        - Neural Network Framework
        - Inference
        - Memory
        - Knowledge Graph
        - Reasoning
        - Executive
        - Capabilities
        - Agents
        - Workflows
        - Tools
        - Distributed
        - Robotics
        - Business
        - Security
        - UI
        - SDK
        - Plugins
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
